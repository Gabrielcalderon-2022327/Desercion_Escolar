<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Gestión de Entidad</title>
  <link rel="stylesheet" href="../styles/Plantilla.css">
</head>

<body>
  <div class="layout">
    <!-- Encabezado de la página-->
    <header class="header">
        <div class="logo">
            <img src="../img/economia.png" alt="Imagen que describa la entidad + logo de la aplicacion">
        </div>
        <!-- Navegacion por la pagina-->
        <ul class="navegacion">
          <li><a href="#">Inicio</a></li>
          <li>
            <!--Menu desplegable para las entidades-->
            <ul class="entidades-menu">
              <li id="usuarios-link"><a href="#">Usuarios</a></li>
              <li id="maestros-link"><a href="#">Maestros</a></li>
              <li id="grado-link"><a href="#">Grado</a></li>
              <li id="encargado-link"><a href="#">Encargado</a></li>
              <li id="estudiante-link"><a href="#">Estudiante</a></li>
              <li id="asistencia-link"><a href="#">Asistencia</a></li>
              <li id="materiasF-link"><a href="#">Materias perdidas</a></li>
              <li id="economia-link"><a href="#">Economia</a></li>
              <li id="riesgo-link"><a href="#">Riesgo</a></li>
              <li id="alerta-link"><a href="#">Alerta</a></li>
            </ul>
          </li>
        </ul>

        <!--Informacion del usuario y boton para cerrar sesion-->
        <div class="user-info">
            <span>Gabriel</span>
            <button class="btn-cerrarSesion">Cerrar sesión</button>
        </div>
    </header>

    <main class="main-content">
      <h1 class="titulo-entidad">Economía</h1>

      <!-- Botones para el put, post, delete y get-->
      <div class="crud-actions">
        <button class="btn-crud" id="btn-crear">Crear</button>
        <button class="btn-crud" id="btn-actualizar">Actualizar</button>
        <button class="btn-crud" id="btn-eliminar">Eliminar</button>
        <button class="btn-crud" id="btn-listar">Listar</button>
      </div>

      <!-- Barra de busqueda-->
      <div class="crud-search">
        <input type="text" placeholder="Buscar por ID o nombre...">
        <button class="btn-crud" id="btn-buscar">
          <img src="../img/buscar.png" alt="Logo de busqueda">
        </button>
      </div>

      <!-- Tabla de las entidades-->
      <div class="table-container">
        <table class="crud-table">

          <thead> <!-- Encabezado de las columnas-->
            <tr>
              <th>id_economia</th>
              <th>ingresos_economia</th>
              <th>fecha_economia</th>
              <th>fk_id_estudiante</th>
            </tr>
          </thead>

          <tbody> <!-- Contenido de la tabla-->
            <tr> <!-- Filas de ejemplo (tr representa una fila)-->
              <td>1</td> <!-- Filas de ejemplo (td representa la informacion de una celda, debe cazar con el th)-->
              <td>2500.50</td>
              <td>2026-01-30</td>
              <td>1</td>
            </tr>
           <tr> <!-- Filas de ejemplo (tr representa una fila)-->
              <td>1</td> <!-- Filas de ejemplo (td representa la informacion de una celda, debe cazar con el th)-->
              <td>3000.00</td>
              <td>2026-01-30</td>
              <td>3</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

  </div>
</body>

</html>
