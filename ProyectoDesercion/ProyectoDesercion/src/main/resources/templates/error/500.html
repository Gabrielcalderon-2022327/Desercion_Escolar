<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 500 - Error Interno del Servidor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cielo: #8ECAE6;
            --teal: #219EBC;
            --marino: #023047;
            --amarillo: #FFB703;
            --naranja: #FB8500;
            --fondo: #f0f7fc;
            --fondo-tarjeta: #ffffff;
            --texto-principal: #023047;
            --texto-secundario: #4a7a96;
            --borde: #c8e0ec;
        }

        * { box-sizing: border-box; margin:0; padding:0; }

        body {
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--fondo) 0%, var(--cielo) 100%);
            color: var(--texto-principal);
        }

        .error-500-container {
            background: var(--fondo-tarjeta);
            border-radius: 16px;
            padding: 50px 35px;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 16px 48px rgba(2, 48, 71, 0.15);
            border-top: 6px solid var(--amarillo);
            animation: fadeIn 0.6s ease forwards;
        }

        .error-500-container h1 {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--amarillo), var(--naranja));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: bounce 1s ease infinite alternate;
        }

        .error-500-container h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .error-500-container p {
            font-size: 0.95rem;
            color: var(--texto-secundario);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--marino);
            background-color: var(--amarillo);
            text-decoration: none;
            transition: 0.3s ease;
        }

        .btn-home:hover {
            background-color: var(--naranja);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(251, 133, 0, 0.35);
        }

        .error-icon {
            font-size: 4rem;
            color: var(--teal);
            margin-bottom: 20px;
            animation: shake 1.5s infinite;
            position: relative;
        }

        .error-icon::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: 0 0 0 0 var(--amarillo);
            animation: iconPulse 1.8s ease infinite;
        }

        /* Animaciones */
        @keyframes shake {
            0%,100%{ transform: rotate(0deg); }
            20%{ transform: rotate(-8deg); }
            40%{ transform: rotate(8deg); }
            60%{ transform: rotate(-8deg); }
            80%{ transform: rotate(8deg); }
        }

        @keyframes bounce {
            0%{ transform: translateY(0); }
            50%{ transform: translateY(-10px); }
            100%{ transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity:0; transform: translateY(-20px); }
            to { opacity:1; transform: translateY(0); }
        }

        @keyframes iconPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,183,3,0.3); }
            50% { box-shadow: 0 0 0 12px rgba(255,183,3,0); }
        }

        /* Responsive */
        @media(max-width:480px){
            .error-500-container h1 { font-size: 4rem; }
            .error-icon { font-size: 3rem; }
        }
    </style>
</head>
<body>
<div class="error-500-container">
    <i class="bi bi-exclamation-triangle-fill error-icon"></i>
    <h1>500</h1>
    <h2>Error Interno del Servidor</h2>
    <p>
        Algo inesperado salió mal en el servidor.
        Los estudiantes están confundidos, los maestros están ocupados,
        y los datos del grado se perdieron en el limbo.
        ¡Intenta regresar al inicio o recargar la página!
    </p>
    <a href="/index" class="btn-home"><i class="bi bi-house-door-fill"></i> Volver al Inicio</a>
</div>
</body>
</html>
