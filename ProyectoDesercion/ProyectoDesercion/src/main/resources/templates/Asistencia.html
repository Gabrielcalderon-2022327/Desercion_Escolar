<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Asistencia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="asistenciaStyle.css">
</head>

<body>
  <div class="layout">
    <header class="header">
      <div class="topbar-brand">
        <span class="brand-icon"><i class="bi bi-shield-check"></i></span>
        <span class="brand-name">Asistencia</span>
      </div>

      <ul class="navegacion">
        <li><a th:href="@{/index}">Inicio</a></li>
        <li>
          <ul class="entidades-menu">
            <li><a th:href="@{/usuarios}">Usuarios</a></li>
            <li><a th:href="@{/maestros}">Maestros</a></li>
            <li><a th:href="@{/grado}">Grado</a></li>
            <li><a th:href="@{/encargados}">Encargado</a></li>
            <li><a th:href="@{/estudiantes}">Estudiante</a></li>
            <li><a th:href="@{/materiasf}">Materias perdidas</a></li>
            <li><a th:href="@{/economia}">Economia</a></li>
            <li><a th:href="@{/riesgos}">Riesgo</a></li>
            <li><a th:href="@{/alertas}">Alerta</a></li>
          </ul>
        </li>
      </ul>

      <div class="topbar-user">
        <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
        <span class="user-name" th:text="${username}">Admin</span>
        <a th:href="@{/logout}">
          <button class="btn-logout">Cerrar sesión <i class="bi bi-box-arrow-right"></i></button>
        </a>
      </div>
    </header>

    <main class="main-content">

      <h1 class="titulo-entidad">Gestión de Asistencia</h1>

      <!-- ── PANEL BÚSQUEDA ── -->
      <div class="crud-actions">
        <form class="crud-inputs" th:action="@{/asistencia/listar}" method="get">
          <div>
            <label>Fecha:</label>
            <input type="date" name="fecha_asistencia" required>
          </div>
          <div>
            <label>ID Sección:</label>
            <input type="number" id="id_seccion" name="id_seccion" required>
            <button type="button" class="btn-crud btn-elegir" popovertarget="table-grado">Elegir</button>
          </div>
          <button type="submit" class="btn-crud" id="btn-buscar">Buscar</button>
        </form>

        <div class="message-container">
          <h2 th:if="${error   != null}" th:text="${error}" id="error-text"></h2>
          <h2 th:if="${success != null}" th:text="${success}" id="success-text"></h2>
        </div>
      </div>

      <!--  FORMULARIO Y TABLA  -->
      <form th:action="@{/asistencia/guardar}" method="post">

        <button type="submit" class="btn-crud btn-guardar">Guardar</button>

        <div class="crud-inputs">
          <div>
            <label for="fecha_asistencia1">Fecha:</label>
            <input type="date" id="fecha_asistencia1" name="fecha_asistencia1" th:value="${fecha_asistencia}" required readonly>
          </div>
          <div>
            <label for="id_seccion1">Grado:</label>
            <input type="text" id="id_seccion1" name="id_seccion1" th:value="${seccion_name}" required readonly>
          </div>
        </div>

        <div class="estudiantes-container">
          <table>
            <thead>
              <tr>
                <th>Estudiante</th>
                <th>Asistencia</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="a, iterStat : ${asistencias}">

                <input type="hidden" th:name="'estudiante_' + ${iterStat.index}" th:value="${a.fk_id_estudiante}" />
                <td>
                  <span class="student-avatar"><i class="bi bi-person-fill"></i></span>
                  <span th:text="${a.estudiante.nombre_estudiante + ' ' + a.estudiante.apellido_estudiante}"></span>
                </td>
                <td>
                  <div class="estados-grupo">

                    <!-- PRESENTE -->
                    <label class="estado-label presente">
                      <i class="bi bi-check-circle-fill"></i>
                      Presente
                      <input type="radio" value="presente" th:name="'estado_' + ${iterStat.index}"
                        th:checked="${a.estado_asistencia == 'presente'}" />
                    </label>

                    <!-- TARDANZA -->
                    <label class="estado-label tardanza">
                      <i class="bi bi-clock-fill"></i>
                      Tardanza
                      <input type="radio" value="tardanza" th:name="'estado_' + ${iterStat.index}"
                        th:checked="${a.estado_asistencia == 'tardanza'}" />
                    </label>

                    <!-- AUSENTE -->
                    <label class="estado-label ausente">
                      <i class="bi bi-x-circle-fill"></i>
                      Ausente
                      <input type="radio" value="ausente" th:name="'estado_' + ${iterStat.index}"
                        th:checked="${a.estado_asistencia == 'ausente'}" />
                    </label>

                  </div>
                </td>

              </tr>
            </tbody>
          </table>
        </div>

      </form>

    </main>
  </div>

  <!-- Tabla insertada-->
  <div class="table-container popup-table" id="table-grado" popover="manual">
    <button class="btn-cerrar-popup" popovertarget="table-grado" popovertargetaction="hide" aria-label="Cerrar">✕</button>
    <table class="crud-table">
      <thead> <!-- Encabezado de las columnas-->
        <tr>
          <th>ID</th>
          <th>Nombre Grado</th>
          <th>ID Maestro</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody> <!-- Contenido de la tabla-->
        <tr th:each=" g: ${grados}"> <!-- Filas de ejemplo (tr representa una fila)-->
          <td th:text="${g.id_grado}"></td>
          <td th:text="${g.nombre_grado}"></td>
          <td th:text="${g.fk_id_maestro}"></td>
          <td>
            <div class="actions">
              <button class="btn-crud btn-elegir" onclick="elegirGrado(this)" th:data-grado="${g.id_grado}" popovertarget="table-grado" popovertargetaction="hide">Elegir</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    function elegirGrado(button){
      document.getElementById("id_seccion").value = button.dataset.grado;
    }
  </script>

</body>

</html>
