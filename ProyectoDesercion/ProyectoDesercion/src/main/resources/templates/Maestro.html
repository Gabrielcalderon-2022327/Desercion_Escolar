<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <title>Gestión de Maestros</title>
   <link rel="stylesheet" th:href="@{/Plantilla.css}">
</head>

<body>
<div class="layout">
   <header class="header">
      <div class="logo">
         <img th:src="@{/img/Grado.png}" alt="Logo Maestros">
      </div>
      <ul class="navegacion">
         <li><a th:href="@{/index}">Inicio</a></li>
         <li>
            <ul class="entidades-menu">
               <li id="usuarios-link"><a th:href="@{/usuarios/}">Usuarios</a></li>
               <li id="maestros-link"><a th:href="@{/maestros/}">Maestros</a></li>
               <li id="grado-link"><a th:href="@{/grados/}">Grados</a></li>
               <li id="encargado-link"><a th:href="@{/encargados/}">Encargado</a></li>
               <li id="estudiante-link"><a th:href="@{/estudiantes/}">Estudiante</a></li>
               <li id="asistencia-link"><a th:href="@{/asistencia/}">Asistencia</a></li>
               <li id="materiasF-link"><a th:href="@{/materiasf/}">Materias perdidas</a></li>
               <li id="economia-link"><a th:href="@{/economia/}">Economia</a></li>
               <li id="riesgo-link"><a th:href="@{/riesgos/}">Riesgo</a></li>
               <li id="alerta-link"><a th:href="@{/alertas/}">Alerta</a></li>
            </ul>
         </li>
      </ul>

      <div class="user-info">
         <span>Gabriel</span>
         <form th:action="@{/logout}" method="post">
            <button class="btn-cerrarSesion">Cerrar sesión</button>
         </form>
      </div>
   </header>

   <main class="main-content">
      <h1 class="titulo-entidad">Gestión de Maestros</h1>

      <div class="crud-actions">
         <button class="btn-crud" id="btn-crear" popovertarget="datos" onclick="toggleIdInput(false)">Crear</button>
         <a th:href="@{/maestros/listar}"><button class="btn-crud" id="btn-listar">Listar</button></a>
         <form class="crud-search" th:action="@{/maestros/buscar}" method="get">
            <input type="text" placeholder="Buscar por ID..." name="idMaestro">
            <button type="submit" class="btn-crud" id="btn-buscar">
               <img th:src="@{/img/buscar.png}" alt="Buscar">
            </button>
         </form>
      </div>

      <div id="datos" class="crud-form" popover>
         <form id="popup-form" th:action="@{/maestros}" method="post">

            <div class="input-group">
               <div id="id-container">
                  <label for="idMaestro">ID Maestro:</label>
                  <input type="number" id="idMaestro" name="idMaestro" readonly>
               </div>

               <div>
                  <label for="nombreMaestro">Nombre:</label>
                  <input type="text" id="nombreMaestro" name="nombreMaestro" required>
               </div>

               <div>
                  <label for="apellidoMaestro">Apellido:</label>
                  <input type="text" id="apellidoMaestro" name="apellidoMaestro" required>
               </div>

               <div>
                  <label for="correoMaestro">Correo:</label>
                  <input type="email" id="correoMaestro" name="correoMaestro" required>
               </div>
            </div>

            <div class="btn-container">
               <button type="submit" class="btn-crud" id="btn-crear-popoup">Crear</button>
               <button type="submit" class="btn-crud" id="btn-actualizar-popoup">Actualizar</button>
            </div>
         </form>
      </div>

      <div class="table-container">
         <table class="crud-table">
            <thead>
            <tr>
               <th>ID</th>
               <th>Nombre</th>
               <th>Apellido</th>
               <th>Correo</th>
               <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${maestros}">
               <td th:text="${m.idMaestro}">1</td>
               <td th:text="${m.nombreMaestro}">Juan</td>
               <td th:text="${m.apellidoMaestro}">Pérez</td>
               <td th:text="${m.correoMaestro}">juan@kinal.edu.gt</td>
               <td>
                  <div class="actions">
                     <button class="btn-crud btn-actualizar" popovertarget="datos"
                             th:data-id="${m.idMaestro}"
                             th:data-nombre="${m.nombreMaestro}"
                             th:data-apellido="${m.apellidoMaestro}"
                             th:data-correo="${m.correoMaestro}"
                             onclick="cargarData(this)">Actualizar</button>
                     <a th:href="@{/maestros/eliminar/{id}(id=${m.idMaestro})}">
                        <button class="btn-crud btn-eliminar">Eliminar</button>
                     </a>
                  </div>
               </td>
            </tr>
            </tbody>
         </table>
      </div>
   </main>
</div>

<script>
   // Cargar datos en el popover
   function cargarData(button) {
      document.getElementById("idMaestro").value = button.dataset.id;
      document.getElementById("nombreMaestro").value = button.dataset.nombre;
      document.getElementById("apellidoMaestro").value = button.dataset.apellido;
      document.getElementById("correoMaestro").value = button.dataset.correo;
      toggleIdInput(true);
   }

   // Configurar el formulario para Crear o Editar
   function toggleIdInput(isUpdate) {
      const idContainer = document.getElementById("id-container");
      const btnActualizar = document.getElementById("btn-actualizar-popoup");
      const btnCrear = document.getElementById("btn-crear-popoup");
      const popupForm = document.getElementById("popup-form");

      if (isUpdate) {
         idContainer.style.display = "block";
         btnActualizar.style.display = "inline-block";
         btnCrear.style.display = "none";
         // Ruta para el controlador de maestros
         popupForm.setAttribute("action", "/maestros/editar");
      } else {
         idContainer.style.display = "none";
         btnActualizar.style.display = "none";
         btnCrear.style.display = "inline-block";
         // Limpiar campos al crear
         document.getElementById("popup-form").reset();
         popupForm.setAttribute("action", "/maestros/crear");
      }
   }
</script>
</body>
</html>
