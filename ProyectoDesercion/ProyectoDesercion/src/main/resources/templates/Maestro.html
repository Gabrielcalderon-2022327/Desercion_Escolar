<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <title>Gestión de Maestros</title>
   <link rel="stylesheet" th:href="@{/Plantilla.css}">
</head>

<body>
<div class="layout">
   <header class="header">
      <div class="logo">
         <img th:src="@{/img/Grado.png}" alt="Logo de la aplicación">
      </div>
      <ul class="navegacion">
         <li><a th:href="@{/index}">Inicio</a></li>
         <li>
            <ul class="entidades-menu">
               <li><a th:href="@{/usuarios/}">Usuarios</a></li>
               <li><a th:href="@{/maestros/}">Maestros</a></li>
               <li><a th:href="@{/grados/}">Grados</a></li>
               <li><a th:href="@{/encargados/}">Encargado</a></li>
               <li><a th:href="@{/estudiantes/}">Estudiante</a></li>
               <li><a th:href="@{/asistencia/}">Asistencia</a></li>
               <li><a th:href="@{/materiasf/}">Materias perdidas</a></li>
               <li><a th:href="@{/economia/}">Economía</a></li>
               <li><a th:href="@{/riesgos/}">Riesgo</a></li>
               <li><a th:href="@{/alertas/}">Alerta</a></li>
            </ul>
         </li>
      </ul>

      <div class="user-info">
         <span>Gabriel</span>
         <form th:action="@{/logout}" method="post">
            <button class="btn-cerrarSesion">Cerrar sesión</button>
         </form>
      </div>
   </header>

   <main class="main-content">
      <h1 class="titulo-entidad">Gestión de Maestros</h1>

      <div class="crud-actions">
         <button class="btn-crud" id="btn-crear" popovertarget="datos" onclick="toggleIdInput(false)">Crear Maestro</button>
         <a th:href="@{/maestros/listar}"><button class="btn-crud" id="btn-listar">Listar Todos</button></a>

         <form class="crud-search" th:action="@{/maestros/buscar}" method="get">
            <input type="number" placeholder="Buscar por ID..." name="idMaestro">
            <button type="submit" class="btn-crud" id="btn-buscar">
               <img th:src="@{/img/buscar.png}" alt="Buscar">
            </button>
         </form>
      </div>

      <div id="datos" class="crud-form" popover>
         <form id="popup-form" th:action="@{/maestros/crear}" method="post">

            <div class="input-group">
               <div id="id-container">
                  <label for="id_maestro">ID Maestro:</label>
                  <input type="number" id="id_maestro" name="id_maestro" readonly>
               </div>

               <div>
                  <label for="nombre_maestro">Nombre:</label>
                  <input type="text" id="nombre_maestro" name="nombre_maestro" required>
               </div>

               <div>
                  <label for="especialidad_maestro">Especialidad:</label>
                  <input type="text" id="especialidad_maestro" name="especialidad_maestro" required>
               </div>

               <div>
                  <label for="telefono_maestro">Teléfono:</label>
                  <input type="number" id="telefono_maestro" name="telefono_maestro" required>
               </div>

               <div>
                  <label for="fk_id_usuario">ID Usuario (FK):</label>
                  <input type="number" id="fk_id_usuario" name="fk_id_usuario" required>
               </div>
            </div>

            <div class="btn-container">
               <button type="submit" class="btn-crud" id="btn-crear-popoup">Crear</button>
               <button type="submit" class="btn-crud" id="btn-actualizar-popoup">Actualizar</button>
            </div>
         </form>
      </div>

      <div class="table-container">
         <table class="crud-table">
            <thead>
            <tr>
               <th>ID</th>
               <th>Nombre</th>
               <th>Especialidad</th>
               <th>Teléfono</th>
               <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${maestros}">
               <td th:text="${m.idMaestro}"></td>
               <td th:text="${m.nombreMaestro}"></td>
               <td th:text="${m.especialidadMaestro}"></td>
               <td th:text="${m.telefonoMaestro}"></td>
               <td>
                  <div class="actions">
                     <button class="btn-crud btn-actualizar" popovertarget="datos"
                             th:data-id="${m.idMaestro}"
                             th:data-nombre="${m.nombreMaestro}"
                             th:data-especialidad="${m.especialidadMaestro}"
                             th:data-telefono="${m.telefonoMaestro}"
                             th:data-usuario="${m.idUsuario}"
                             onclick="cargarData(this)">Actualizar</button>

                     <a th:href="@{/maestros/eliminar/{id}(id=${m.idMaestro})}">
                        <button class="btn-crud btn-eliminar">Eliminar</button>
                     </a>
                  </div>
               </td>
            </tr>
            </tbody>
         </table>
      </div>
   </main>
</div>

<script>
   function cargarData(button) {
      document.getElementById("id_maestro").value = button.dataset.id;
      document.getElementById("nombre_maestro").value = button.dataset.nombre;
      document.getElementById("especialidad_maestro").value = button.dataset.especialidad;
      document.getElementById("telefono_maestro").value = button.dataset.telefono;
      document.getElementById("fk_id_usuario").value = button.dataset.usuario;
      toggleIdInput(true);
   }

   function toggleIdInput(isUpdate) {
      const idContainer = document.getElementById("id-container");
      const btnActualizar = document.getElementById("btn-actualizar-popoup");
      const btnCrear = document.getElementById("btn-crear-popoup");
      const popupForm = document.getElementById("popup-form");

      if (isUpdate) {
         idContainer.style.display = "block";
         btnActualizar.style.display = "inline-block";
         btnCrear.style.display = "none";
         popupForm.setAttribute("action", "/maestros/editar");
      } else {
         idContainer.style.display = "none";
         btnActualizar.style.display = "none";
         btnCrear.style.display = "inline-block";
         document.getElementById("popup-form").reset();
         popupForm.setAttribute("action", "/maestros/crear");
      }
   }
</script>
</body>
</html>
