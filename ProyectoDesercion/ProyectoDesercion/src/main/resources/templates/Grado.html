<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <title>Grado</title>
    <link rel="stylesheet" th:href="@{/Plantilla.css}">
</head>

<body>
   <div class="layout">
      <!-- Encabezado de la página-->
      <header class="header">
         <div class="logo">
            <img src="/img/Grado.png" alt="Imagen que describa la entidad + logo de la aplicacion">
         </div>
         <!-- Navegacion por la pagina-->
         <ul class="navegacion">
            <li><a th:href="@{/index}">Inicio</a></li>
            <li>
               <!--Menu desplegable para las entidades-->
               <ul class="entidades-menu">
                  <li id="usuarios-link"><a th:href="@{/usuarios}">Usuarios</a></li>
                  <li id="maestros-link"><a th:href="@{/maestros}">Maestros</a></li>
                  <li id="encargado-link"><a th:href="@{/encargados}">Encargado</a></li>
                  <li id="estudiante-link"><a th:href="@{/estudiantes}">Estudiante</a></li>
                  <li id="asistencia-link"><a th:href="@{/asistencia}">Asistencia</a></li>
                  <li id="materiasF-link"><a th:href="@{/materiasf}">Materias perdidas</a></li>
                  <li id="economia-link"><a th:href="@{/economia}">Economia</a></li>
                  <li id="riesgo-link"><a th:href="@{/riesgos}">Riesgo</a></li>
                  <li id="alerta-link"><a th:href="@{/alertas}">Alerta</a></li>
               </ul>
            </li>
         </ul>

         <!--Informacion del usuario y boton para cerrar sesion-->
         <div class="user-info">
            <span>Gabriel</span>
            <form th:action="@{/logout}" method="post">
               <button class="btn-cerrarSesion">Cerrar sesión</button>
            </form>
         </div>
      </header>

      <main class="main-content">
         <h1 class="titulo-entidad">Gestión de Grados</h1>

         <!-- Botones para el put, post, delete y get-->
         <div class="crud-actions">
            <button class="btn-crud" id="btn-crear" popovertarget="datos" onclick="toggleIdInput(false)">Crear</button>
            <a th:href="@{/grados/listar}"><button class="btn-crud" id="btn-listar">Listar</button></a>
            <form class="crud-search" th:action="@{/grados/buscar}" method="get">
               <input type="text" placeholder="Buscar por ID..." name="idUsuario">
               <button type="submit" class="btn-crud" id="btn-buscar">
                  <img src="/img/buscar.png" alt="Logo de busqueda">
               </button>
            </form>
         </div>

         <!-- Formulario para crear o actualizar una entidad-->
         <div id="datos" class="crud-form" popover>
            <form id="popup-form" th:action="@{/grados}" method="post">

               <div class="input-group">

                  <div id="user-container">
                     <label for="id_grado">ID Alerta:</label>
                     <input type="number" id="id_grado" name="id_grado" readonly required>
                  </div>

                  <div>
                     <label for="nombre_grado">Nombre:</label>
                     <input type="text" id="nombre_grado" name="nombre_grado" required>
                  </div>

                  <div>
                     <label for="fk_id_maestro">ID Maestro:</label>
                     <input type="number" id="fk_id_maestro" name="fk_id_maestro" required>
                  </div>


               </div>
               <div class="btn-container">
                  <button type="submit" class="btn-crud" id="btn-crear-popoup">Crear</button>
                  <button type="submit" class="btn-crud" id="btn-actualizar-popoup">Actualizar</button>
               </div>
            </form>
         </div>

         <!-- Tabla de las entidades-->
         <div class=" table-container">
            <table class="crud-table">

               <thead> <!-- Encabezado de las columnas-->
                  <tr>
                     <th>ID</th>
                     <th>Nombre Grado</th>
                     <th>ID Maestro</th>
                     <th>Acciones</th>
                  </tr>
               </thead>

               <tbody> <!-- Contenido de la tabla-->
                  <tr th:each=" g: ${grados}"> <!-- Filas de ejemplo (tr representa una fila)-->
                     <td th:text="${g.id_grado}">1</td>
                     <td th:text="${g.nombre_grado}"></td>
                     <td th:text="${g.fk_id_maestro}"></td>
                     <td>
                        <div class="actions">
                           <button class="btn-crud btn-actualizar" popovertarget="datos"
                              th:data-id="${g.id_grado}"
                              th:data-nombre="${g.nombre_grado}" th:data-maestro="${g.fk_id_maestro}"
                              onclick="cargarData(this)">Actualizar</button>
                           <a th:href="@{/grados/eliminar/{id}(id=${g.id_grado})}"><button class="btn-crud btn-eliminar">Eliminar</button></a>
                        </div>
                     </td>
                  </tr>
               </tbody>
            </table>
         </div>
      </main>
   </div>

   <script>
      //FUNCION PARA CARGAR LOS DATOS EN EL FORMULARIO DE ACTUALIZACION
      function cargarData(button) {
         document.getElementById("id_grado").value = button.dataset.id;
         document.getElementById("nombre_grado").value = button.dataset.nombre;
         document.getElementById("fk_id_maestro").value = button.dataset.maestro;
         toggleIdInput(true);
      }

      //FUNCION PARA OCULTAR Y MOSTRAR EL INPUT DEL ID
      function toggleIdInput(isUpdate) {
         const userContainer = document.getElementById("user-container");
         const btnActualizar = document.getElementById("btn-actualizar-popoup");
         const btnCrear = document.getElementById("btn-crear-popoup");
         const popupForm = document.getElementById("popup-form");
         if (isUpdate) {
            userContainer.style.display = "block";
            btnActualizar.style.display = "inline-block";
            btnCrear.style.display = "none";
            popupForm.setAttribute("action", "/grados/editar");
         } else {
            userContainer.style.display = "none";
            btnActualizar.style.display = "none";
            btnCrear.style.display = "inline-block";
            popupForm.setAttribute("action", "/grados/crear");
         }

      }
   </script>

</body>

</html>
